version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: role_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: role_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# For Ollama:
# Run locally: ollama pull mistral && ollama serve
# Or use: docker run -d -v ollama:/root/.ollama -p 11434:11434 --name ollama ollama/ollama:latest
